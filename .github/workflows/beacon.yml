# The live beacon.
#
# Beamline's claim is that nobody can predict a pulse before it is published. A claim
# like that needs a chain that keeps growing in public, and an ordering between "you
# guessed" and "the value existed" that we cannot quietly reverse. This workflow is
# both: it emits one signed pulse per run, and it runs somewhere whose clock and logs
# belong to GitHub rather than to us.
#
# Every run leaves three public artefacts an attacker can audit: the commit, the run
# log, and the signature on the pulse itself. None of them can be edited after the
# fact, which is what makes the challenge adjudicable by a stranger.
#
# ONE-TIME SETUP. The beacon cannot run without this:
#
#   1. Generate a signing key:            beamline beacon-key
#   2. Repository Settings -> Secrets and variables -> Actions -> New secret
#      Name:  BEAMLINE_BEACON_KEY
#      Value: the hex private key from step 1
#
# Keep that key. Losing it does not break anything already published (every pulse
# stays verifiable against the public key baked into it), but a new key starts a new
# chain from round 1, and the challenge starts over with it.

name: beacon

on:
  schedule:
    # A restart signal, not the cadence. GitHub runs scheduled jobs late under load,
    # and on this repository a */10 schedule fired roughly every forty-five minutes.
    # The job itself keeps the ten-minute rhythm, and asking often means the next run
    # begins as soon as the current one ends. `verify_chain` only enforces spacing
    # when asked to, so the chain stays honest about when each pulse actually landed.
    - cron: "*/10 * * * *"

  # A second way back to life that does not depend on the scheduler at all. If the
  # cron is throttled hard enough to skip an entire loop, any push to main restarts
  # the beacon within seconds. The beacon's own commits cannot cause a loop here:
  # GitHub deliberately refuses to trigger workflows from pushes made with
  # GITHUB_TOKEN, and `paths-ignore` means a pulse would not qualify even if that
  # protection were ever lifted.
  push:
    branches: [main]
    paths-ignore:
      - "beacon/**"

  workflow_dispatch:

# Two runs emitting at once would both claim the same round number and one would lose
# its push. Queue them instead of cancelling: a cancelled tick is a missing round, and
# a missing round is exactly what `verify-chain` reports as a hole to everybody.
concurrency:
  group: beacon
  cancel-in-progress: false

permissions:
  contents: write   # to commit the pulse
  issues: write     # to score and close predictions

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e .

      - name: Publish a pulse every ten minutes
        env:
          BEAMLINE_BEACON_KEY: ${{ secrets.BEAMLINE_BEACON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          git config user.name  "beamline-beacon"
          git config user.email "beacon@users.noreply.github.com"

          publish () {
            git add beacon/
            if git diff --staged --quiet; then
              echo "nothing to publish"
              return 0
            fi
            round=$(python -c "import json;print(json.load(open('beacon/chain.json'))['latest_round'])")
            # [skip ci] keeps the test suite off every pulse. The pulse changes no
            # code, and duplicate green runs all day would bury the ones that matter.
            git commit -m "beacon: round ${round} [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                 && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                return 0
              fi
              echo "push race on attempt ${attempt}; retrying"
              sleep 5
            done
            echo "could not publish round ${round} after three attempts" >&2
            return 1
          }

          # GitHub honours a */10 schedule when it feels like it. The first four runs
          # of this beacon fired 54, 44 and 45 minutes apart, which left the page saying
          # a pulse was due for most of an hour. So the schedule is treated as a restart
          # signal and the cadence is kept here, by a loop that outlives any one trigger.
          #
          # Two and three quarter hours of emitting, against a scheduler that turns up
          # roughly every fifty minutes. Matching the loop to the observed gap would
          # leave nothing spare, and a single skipped trigger would still show as a
          # stalled beacon. This absorbs three of them.
          #
          # Overlapping runs cannot collide: the concurrency group above serialises
          # them, and GitHub keeps at most one queued, so the next run starts as this
          # one ends.
          deadline=$(( $(date +%s) + 9900 ))
          while :; do
            slot=$(( $(date +%s) + 600 ))

            # Pick up code pushed since this run started. A run lasts nearly three
            # hours, so without this a fix waits that long to take effect, and the
            # only pull was the one inside publish, after the tick had already used
            # the old code. That cost two rounds to deploy a one line change and made
            # it look as though the fix had not worked. The install is editable, so
            # updating the working tree is all it takes.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              || echo "could not refresh the checkout; continuing on the current code" >&2

            if python scripts/beacon_tick.py --gather 25 --period 600; then
              # Scoring is allowed to fail without costing the pulse. The pulse is the
              # published record; a prediction that goes unscored this round is picked
              # up by the next run, because it stays open until it is resolved.
              python scripts/resolve_predictions.py || echo "scoring failed" >&2
              publish || echo "publishing failed" >&2
            else
              echo "tick failed; the chain is unchanged" >&2
            fi

            [ "$(date +%s)" -ge "${deadline}" ] && break
            wait_for=$(( slot - $(date +%s) ))
            [ "${wait_for}" -gt 0 ] && sleep "${wait_for}"
          done
