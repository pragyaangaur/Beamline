name: CI

on:
  push:
    branches: ["**"]
    # The beacon commits a pulse every ten minutes and changes no code doing it.
    # Without this, the interesting CI runs would be buried under 144 identical
    # green ones a day. A commit that touches anything else still runs the suite.
    paths-ignore:
      - "beacon/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev,qa]"

      - name: Tests
        run: pytest -q

  # The JavaScript verifiers ship to strangers who are invited to attack them, so they
  # are attacked here too. They live in three separate files and had three copies of
  # the same holes; this is what stops a fix landing in one and being forgotten in the
  # other two.
  #
  # Node and nothing else, deliberately. The harness once shelled out to Python for a
  # cross-SDK comparison and failed here on the missing runtime rather than on
  # anything it was testing. Both sides now check themselves against committed
  # vectors, and keeping this job bare is what stops that coupling coming back.
  verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Attack every JavaScript verifier
        run: node scripts/check_js_verifiers.mjs

  # The demo page and the published draw record carry baked-in data. If it ever drifts
  # out of step with the pulse format, the page becomes a live demonstration of
  # Beamline's own verification failing -- which is worse than shipping no demo.
  published-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: The published chain and draw record must verify
        run: pytest -q tests/test_site.py tests/test_attacks.py

      # verify.py promises it needs only the standard library and cryptography. A
      # reader who takes that at face value and installs neither the package nor an
      # HTTP client should still be able to check a draw.
      - name: The verifier imports on its own
        run: |
          cd "$(mktemp -d)"
          cp -r "$GITHUB_WORKSPACE/sdk/python" .
          python3 -c "
          import sys; sys.path.insert(0, 'python')
          from beamline_client import check_draw, reproduce_unique_integers
          print('verifier imports with no package install:', bool(check_draw))
          "
