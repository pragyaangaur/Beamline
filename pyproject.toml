[project]
name = "beamline"
version = "0.1.0"
description = "Physically-sourced randomness as a service, with a verifiable public beacon."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
qa = ["numpy>=1.26"]
http2 = ["httpx[http2]>=0.27"]

[project.scripts]
beamline = "beamline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beamline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
