[project]
name = "beamline"
version = "1.0.0"
description = "Physically-sourced randomness as a service, with a verifiable public beacon."
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    # Ed25519. Not optional: a beacon whose pulses cannot be signed or verified is
    # not a beacon, and an install that silently lacks it produces a service that
    # looks identical and proves nothing.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
qa = ["numpy>=1.26"]
http2 = ["httpx[http2]>=0.27"]

[project.scripts]
beamline = "beamline.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beamline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
